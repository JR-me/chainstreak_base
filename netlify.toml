[build]
  command         = "npm run build"
  publish         = "out"

[build.environment]
  NODE_VERSION    = "20"
  # BUILD_TARGET is intentionally NOT set here — Netlify uses the plain build,
  # which produces no basePath. GitHub Pages sets BUILD_TARGET=github instead.

# Serve every route from its pre-rendered HTML file.
# next export + trailingSlash writes /about/index.html, so /* → /index.html
# is only needed as a final fallback for unknown paths.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
